<svg width="1000" height="320" viewBox="0 0 1000 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="SupportIQ : AI customer support copilot that answers only from a knowledge base and hands over to a human when it is not sure" xmlns:c2pa="http://c2pa.org/manifest">
