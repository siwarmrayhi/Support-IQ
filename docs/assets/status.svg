<svg width="1000" height="230" viewBox="0 0 1000 230" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Ticket status: an automatic answer goes straight to Done; an escalated ticket goes to To do, then In progress, then Done when a manager replies" xmlns:c2pa="http://c2pa.org/manifest">
<defs>
<linearGradient id="acc" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#00e5c0"/><stop offset="1" stop-color="#8b7bff"/></linearGradient>
<linearGradient id="acc2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8b7bff"/><stop offset="1" stop-color="#ff6b9d"/></linearGradient>
<linearGradient id="card" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#171a3a"/><stop offset="1" stop-color="#0e1330"/></linearGradient>
<linearGradient id="bgh" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1020"/><stop offset="0.55" stop-color="#1a1545"/><stop offset="1" stop-color="#0a3a40"/></linearGradient>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.05"/></pattern>
<filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="1000" height="230" rx="18" fill="#0d1020"/>
<circle cx="40" cy="150" r="10" fill="#ff6b9d"/><text x="40" y="190" text-anchor="middle" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="12" fill="#9aa3d0">ticket</text>
<rect x="130" y="120" width="170" height="60" rx="30" fill="#ffb86b" fill-opacity="0.14" stroke="#ffb86b" stroke-width="2"/><circle cx="158" cy="150" r="7" fill="#ffb86b"/><text x="176" y="156" font-family="'Segoe UI',-apple-system,Helvetica,Arial,sans-serif" font-size="18" font-weight="700" fill="#ffffff">To do</text>
<rect x="450" y="120" width="170" height="60" rx="30" fill="#8b7bff" fill-opacity="0.14" stroke="#8b7bff" stroke-width="2"/><circle cx="478" cy="150" r="7" fill="#8b7bff"/><text x="496" y="156" font-family="'Segoe UI',-apple-system,Helvetica,Arial,sans-serif" font-size="18" font-weight="700" fill="#ffffff">In progress</text>
<rect x="770" y="120" width="170" height="60" rx="30" fill="#3ddc97" fill-opacity="0.14" stroke="#3ddc97" stroke-width="2"/><circle cx="798" cy="150" r="7" fill="#3ddc97"/><text x="816" y="156" font-family="'Segoe UI',-apple-system,Helvetica,Arial,sans-serif" font-size="18" font-weight="700" fill="#ffffff">Done</text>
<line x1="52" y1="150" x2="120" y2="150" stroke="#ff5c7a" stroke-width="2.2" stroke-dasharray="6 4"><animate attributeName="stroke-dashoffset" from="0" to="-16" dur="1.6s" repeatCount="indefinite"/></line><polygon points="128,150 119,144 119,156" fill="#ff5c7a"/><text x="90" y="138" text-anchor="middle" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="11" fill="#ff5c7a">escalated</text>
<line x1="305" y1="150" x2="440" y2="150" stroke="#9aa3d0" stroke-width="2.2" stroke-dasharray="6 4"><animate attributeName="stroke-dashoffset" from="0" to="-16" dur="1.6s" repeatCount="indefinite"/></line><polygon points="448,150 439,144 439,156" fill="#9aa3d0"/><text x="375" y="138" text-anchor="middle" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="12" fill="#9aa3d0">manager takes it</text>
<line x1="625" y1="150" x2="760" y2="150" stroke="#9aa3d0" stroke-width="2.2" stroke-dasharray="6 4"><animate attributeName="stroke-dashoffset" from="0" to="-16" dur="1.6s" repeatCount="indefinite"/></line><polygon points="768,150 759,144 759,156" fill="#9aa3d0"/><text x="695" y="138" text-anchor="middle" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="12" fill="#9aa3d0">manager replies</text>
<path d="M40,138 C40,26 855,26 855,112" fill="none" stroke="#3ddc97" stroke-width="2.2" stroke-dasharray="6 4"><animate attributeName="stroke-dashoffset" from="0" to="-16" dur="1.6s" repeatCount="indefinite"/></path><polygon points="855,120 849,111 861,111" fill="#3ddc97"/><text x="450" y="52" text-anchor="middle" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="13" fill="#3ddc97">automatic answer (grounded) goes straight to Done</text>

<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
