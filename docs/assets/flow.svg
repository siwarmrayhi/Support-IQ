<text x="400.0" y="126" text-anchor="middle" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="14" font-weight="700" fill="#ffffff">grade_documents</text>
<text x="400.0" y="146" text-anchor="middle" font-family="'Segoe UI',-apple-system,Helvetica,Arial,sans-serif" font-size="12" fill="#9aa3d0">keep relevant ones</text>
<rect x="515" y="100" width="140" height="60" rx="12" fill="url(#card)" stroke="#00e5c0" stroke-width="2"/>
<text x="585.0" y="126" text-anchor="middle" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="14" font-weight="700" fill="#ffffff">generate_answer</text>
