<text x="770.0" y="126" text-anchor="middle" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="14" font-weight="700" fill="#ffffff">validate_answer</text>
<text x="770.0" y="146" text-anchor="middle" font-family="'Segoe UI',-apple-system,Helvetica,Arial,sans-serif" font-size="12" fill="#9aa3d0">grounded?</text>
