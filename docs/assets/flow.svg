<text x="65.0" y="146" text-anchor="middle" font-family="'Segoe UI',-apple-system,Helvetica,Arial,sans-serif" font-size="12" fill="#9aa3d0">input</text>
<rect x="155" y="100" width="130" height="60" rx="12" fill="url(#card)" stroke="#8b7bff" stroke-width="2"/>
<text x="220.0" y="126" text-anchor="middle" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="14" font-weight="700" fill="#ffffff">retrieve</text>
<text x="220.0" y="146" text-anchor="middle" font-family="'Segoe UI',-apple-system,Helvetica,Arial,sans-serif" font-size="12" fill="#9aa3d0">top 4 chunks</text>
