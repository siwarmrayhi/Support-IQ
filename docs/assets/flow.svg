<path d="M905,160 V262 H620 V290" fill="none" stroke="#ff5c7a" stroke-width="2.2" stroke-dasharray="6 4"><animate attributeName="stroke-dashoffset" from="0" to="-16" dur="1.6s" repeatCount="indefinite"/></path><polygon points="620,296 614,287 626,287" fill="#ff5c7a"/><text x="762" y="252" text-anchor="middle" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="12" fill="#ff5c7a">not grounded</text>
<rect x="745" y="300" width="270" height="62" rx="12" fill="#3ddc97" fill-opacity="0.12" stroke="#3ddc97" stroke-width="2"/>
<text x="880" y="326" text-anchor="middle" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="15" font-weight="700" fill="#ffffff">auto response</text><text x="880" y="348" text-anchor="middle" font-family="'Segoe UI',-apple-system,Helvetica,Arial,sans-serif" font-size="12.5" fill="#c9f5de">answer + documents consulted</text>
<line x1="962" y1="164" x2="962" y2="288" stroke="#3ddc97" stroke-width="2.2" stroke-dasharray="6 4"><animate attributeName="stroke-dashoffset" from="0" to="-16" dur="1.6s" repeatCount="indefinite"/></line><polygon points="962,296 956,287 968,287" fill="#3ddc97"/><text x="974" y="232" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="12" fill="#3ddc97">grounded</text>
<text x="20" y="400" font-family="'Segoe UI',-apple-system,Helvetica,Arial,sans-serif" font-size="14" fill="#9aa3d0">Routing decisions are plain Python functions, not LLM choices. decide and escalate make no LLM call.</text>

